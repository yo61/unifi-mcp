version: 2

# Commit type decides whether an update ships. release-please treats every
# visible changelog section as releasable, so `deps` both lists an update in
# the changelog and cuts a patch release, while `chore` does neither. The line
# is drawn at what reaches users: only updates that change the published
# package use `deps`. See yo61/jobhound
# decisions/2026-08-13-dependency-updates-and-releases.md.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Runtime dependencies ship, so they keep `deps`. The dev group ships
    # nothing, so `prefix-development` routes it to `chore(deps)`. The groups
    # are split by dependency-type so every PR has an unambiguous prefix.
    commit-message:
      prefix: "deps"
      prefix-development: "chore(deps)"
    groups:
      npm-production:
        dependency-type: "production"
        patterns: ["*"]
      npm-development:
        dependency-type: "development"
        patterns: ["*"]
    ignore:
      # Hold TypeScript on 6.x until the toolchain (ty, oxlint/tsgolint, tsx)
      # supports the 7.0 native compiler. Re-evaluate before removing.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      hooks:
        patterns: ["*"]
