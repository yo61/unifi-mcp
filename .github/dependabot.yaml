version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Route dependency bumps to the Dependencies changelog section.
    # release-please picks a section by commit *type*, and the default
    # `chore(deps)` is type `chore`, which the preset hides. No
    # `include: scope` -- it would produce `deps(deps):`.
    commit-message:
      prefix: "deps"
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # Hold TypeScript on 6.x until the toolchain (ty, oxlint/tsgolint, tsx)
      # supports the 7.0 native compiler. Re-evaluate before removing.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Route dependency bumps to the Dependencies changelog section.
    # release-please picks a section by commit *type*, and the default
    # `chore(deps)` is type `chore`, which the preset hides. No
    # `include: scope` -- it would produce `deps(deps):`.
    commit-message:
      prefix: "deps"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Route dependency bumps to the Dependencies changelog section.
    # release-please picks a section by commit *type*, and the default
    # `chore(deps)` is type `chore`, which the preset hides. No
    # `include: scope` -- it would produce `deps(deps):`.
    commit-message:
      prefix: "deps"
    groups:
      hooks:
        patterns: ["*"]
