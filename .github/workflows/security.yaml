name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv-scan:
    name: osv-scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm 12 writes pnpm-lock.yaml as two YAML documents -- a packageManager
      # record (pnpm itself plus its @pnpm/exe.* platform builds), then the
      # dependency graph. osv-scanner reads only the first, so scanning the file
      # as it stands reports a handful of packages and still exits 0: the scan
      # fails open. Reduce the file to the dependency document in place -- the
      # checkout is disposable, and keeping the original path means SARIF
      # locations still resolve to a file that exists in the repository, so
      # code-scanning alerts keep their anchor.
      #
      # This drops pnpm's own packages from *this* job. sbom-scan below reads the
      # whole lockfile through syft, so they stay covered by grype.
      - name: Reduce pnpm-lock.yaml to its dependency document
        run: |
          set -euo pipefail
          # The guard asserts the split is lossless rather than comparing against
          # a package count written down here: a literal goes stale every time
          # the tree changes, and a threshold loose enough to survive that is too
          # loose to catch a scanner reading the wrong document. Instead, require
          # that every resolution lands in exactly one of the two documents and
          # that the one we keep is the larger. A future pnpm that reorders the
          # documents, collapses them into one, or adds a third then fails loudly
          # instead of handing the scanner nine packages and passing.
          #
          # `|| true`: grep -c exits 1 on zero matches, which `set -e` would turn
          # into a silent failure before the error message below.
          total=$(grep -c 'resolution: {integrity:' pnpm-lock.yaml || true)
          awk '/^---$/ { doc++; next } doc == 2 { print }' pnpm-lock.yaml > lock.tmp
          kept=$(grep -c 'resolution: {integrity:' lock.tmp || true)
          dropped=$(awk '/^---$/ { doc++; next } doc == 1 { print }' pnpm-lock.yaml \
            | grep -c 'resolution: {integrity:' || true)
          echo "lockfile: $total resolutions, keeping $kept, dropping $dropped"
          if [ "$total" -ne "$((kept + dropped))" ]; then
            echo "::error::lockfile split lost resolutions: $total != $kept + $dropped"
            exit 1
          fi
          if [ "$kept" -le "$dropped" ]; then
            echo "::error::kept document holds $kept resolutions vs $dropped dropped; not the dependency graph"
            exit 1
          fi
          mv lock.tmp pnpm-lock.yaml
      - id: osv
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
            --format=sarif
            --output=osv.sarif
      # hashFiles guards the case where the reduce step failed: without it this
      # runs anyway and buries that error under `Path does not exist: osv.sarif`.
      - if: always() && github.event_name != 'pull_request' && hashFiles('osv.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: osv.sarif
          category: osv-scanner
      - if: steps.osv.outcome == 'failure'
        run: |
          echo "::error::osv-scanner reported vulnerabilities. See the Security tab."
          exit 1

  sbom-scan:
    name: sbom-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: sbom
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom.cdx.json
      # The osv-scan job above learned that a scanner can read part of a lockfile
      # and still exit 0. Nothing asserted the same for this path, so state what
      # currently holds: syft reads both documents, and the SBOM carries at least
      # as many libraries as the lockfile has resolutions. The 80% floor leaves
      # room for legitimate deduplication without admitting a scan that silently
      # dropped a document.
      - name: Assert the SBOM covers the dependency graph
        run: |
          set -euo pipefail
          components=$(jq '[.components[]? | select(.type == "library")] | length' sbom.cdx.json)
          locked=$(grep -c 'resolution: {integrity:' pnpm-lock.yaml || true)
          echo "sbom: $components libraries, lockfile: $locked resolutions"
          if [ "$components" -lt "$((locked * 8 / 10))" ]; then
            echo "::error::SBOM holds $components libraries for $locked locked packages; syft under-reported"
            exit 1
          fi
      - id: grype
        continue-on-error: true
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: sbom.cdx.json
          fail-build: true
          severity-cutoff: high
          output-format: sarif
      - if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype
      - if: steps.grype.outcome == 'failure'
        run: |
          echo "::error::grype found severity >= HIGH. See the Security tab."
          exit 1
