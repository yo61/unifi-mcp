name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x
      - run: pnpm install --frozen-lockfile
      - run: task dev:check

  commitlint:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Fork of wagoid/commitlint-github-action. Upstream is unmaintained: no
      # commit to master since 2025-01-14, and it pins @commitlint/ensure ^19,
      # two majors behind. This fork runs commitlint v21 on node 24, and pins its
      # runtime image by digest so the SHA pin here cannot be worked around.
      - uses: yo61/commitlint-github-action@501ff7bb31eb7133c871318c877d0e43cd1ff500 # v6.3.0 (digest-pinned)
        with:
          configFile: commitlint.config.mjs

  # Runs the same hooks contributors run locally (.pre-commit-config.yaml).
  #
  # SKIP covers the hooks the `check` job already runs, so they aren't executed
  # twice. It also keeps this job free of a pnpm install: those hooks are
  # `language: system` and shell out to pnpm, so without skipping them prek would
  # need the full toolchain here just to duplicate work.
  #
  # `check` is deliberately NOT replaced by prek: its `pnpm test` runs the whole
  # vitest suite, whereas the vitest hook excludes test/integration. Swapping them
  # would quietly drop integration tests from CI.
  #
  # commitlint is at the commit-msg stage and `prek run` skips it automatically.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        with:
          prek-version: 0.4.13
        env:
          SKIP: oxfmt,oxlint,tsc,scripts-syntax,vitest,pnpm-install
          JACTIONLINT_ONLINE: 1
          GITHUB_TOKEN: ${{ github.token }}

  # The gitleaks pre-commit hook runs `gitleaks git --pre-commit --staged`, which
  # diffs the index against HEAD. On a fresh checkout those are identical, so the
  # hook is a silent no-op under `prek run --all-files` and cannot gate anything.
  # Scan the working tree explicitly instead.
  #
  # Uses the MIT-licensed CLI directly rather than gitleaks-action, which has been
  # proprietary since v2.0.0 and requires a GITLEAKS_LICENSE secret for
  # organisation accounts.
  #
  # The image is pinned by digest (= v8.30.1) for the same reason actions are
  # pinned by SHA.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan working tree for secrets
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir /repo --redact --verbose
