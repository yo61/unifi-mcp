name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # The supported range, from engines' floor (>=22.0.0) to current, not a pin: widen it by
        # hand when a Node is added to or dropped from support.
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No version: pnpm/action-setup reads packageManager in package.json, the one pnpm pin.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        env:
          # setup-task adds the v itself, so the value is the bare version.
          # renovate: datasource=github-releases depName=go-task/task extractVersion=^v(?<version>.+)$
          TASK_VERSION: 3.54.0
        with:
          version: ${{ env.TASK_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: task dev:check

  commitlint:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Fork of wagoid/commitlint-github-action. Upstream is unmaintained: no
      # commit to master since 2025-01-14, and it pins @commitlint/ensure ^19,
      # two majors behind. This fork runs commitlint v21 on node 24, and pins its
      # runtime image by digest so the SHA pin here cannot be worked around.
      - uses: yo61/commitlint-github-action@501ff7bb31eb7133c871318c877d0e43cd1ff500 # v6.3.0 (digest-pinned)
        with:
          configFile: commitlint.config.mjs

  # Runs the same hooks contributors run locally (.pre-commit-config.yaml).
  #
  # SKIP covers the hooks the `check` job already runs, so they aren't executed
  # twice. It also keeps this job free of a pnpm install: those hooks are
  # `language: system` and shell out to pnpm, so without skipping them prek would
  # need the full toolchain here just to duplicate work.
  #
  # `check` is deliberately NOT replaced by prek: its `pnpm test` runs the whole
  # vitest suite, whereas the vitest hook excludes test/integration. Swapping them
  # would quietly drop integration tests from CI.
  #
  # commitlint is at the commit-msg stage and `prek run` skips it automatically.
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        env:
          SKIP: oxfmt,oxlint,tsc,scripts-syntax,vitest,pnpm-install,zizmor
          # renovate: datasource=github-releases depName=j178/prek extractVersion=^v(?<version>.+)$
          PREK_VERSION: 0.5.4
        with:
          prek-version: ${{ env.PREK_VERSION }}
      # zizmor on its own, so only it sees the token, which lets it run its online audits
      # (impostor commits, known-vulnerable actions); without one it skips them and still passes.
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        env:
          GH_TOKEN: ${{ github.token }}
          # renovate: datasource=github-releases depName=j178/prek extractVersion=^v(?<version>.+)$
          PREK_VERSION: 0.5.4
        with:
          prek-version: ${{ env.PREK_VERSION }}
          extra-args: zizmor --all-files

  # The gitleaks pre-commit hook runs `gitleaks git --pre-commit --staged`, which
  # diffs the index against HEAD. On a fresh checkout those are identical, so the
  # hook is a silent no-op under `prek run --all-files` and cannot gate anything.
  # This job runs the manual-stage `gitleaks-dir` hook instead, which scans the
  # working tree with the same gitleaks build, so the hook's `rev:` in
  # .pre-commit-config.yaml is the one gitleaks pin and local and CI scan with the
  # same rules.
  #
  # Uses the MIT-licensed CLI rather than gitleaks-action, which has been
  # proprietary since v2.0.0 and requires a GITLEAKS_LICENSE secret for
  # organisation accounts.
  secrets:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan working tree for secrets
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        env:
          # renovate: datasource=github-releases depName=j178/prek extractVersion=^v(?<version>.+)$
          PREK_VERSION: 0.5.4
        with:
          prek-version: ${{ env.PREK_VERSION }}
          extra-args: --hook-stage manual gitleaks-dir --all-files
