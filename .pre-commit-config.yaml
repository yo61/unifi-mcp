default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-json
      - id: check-yaml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # Local protection only: this scans the staged diff, so it catches a secret
      # as you commit it. It is a no-op on a fresh checkout (index == HEAD), which
      # is why CI has a separate `secrets` job scanning the working tree.
      - id: gitleaks

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2

  - repo: local
    hooks:
      - id: oxfmt
        name: oxfmt --check
        entry: pnpm oxfmt --check
        language: system
        # oxfmt formats markdown as well as TS/JS, and CI runs it over the
        # whole repo. Without markdown here, a docs-only commit skips the
        # hook locally and fails CI instead.
        types_or: [ts, tsx, javascript, jsx, markdown]
        pass_filenames: false
      - id: oxlint
        name: oxlint
        entry: pnpm oxlint
        language: system
        types_or: [ts, tsx, javascript, jsx]
        pass_filenames: false
      - id: tsc
        name: tsc --noEmit
        entry: pnpm typecheck
        language: system
        pass_filenames: false
      - id: scripts-syntax
        name: node --check scripts/
        entry: pnpm check:scripts
        language: system
        files: ^scripts/.*\.mjs$
        pass_filenames: false
      - id: vitest
        name: vitest (unit + component)
        entry: pnpm vitest run --exclude test/integration
        language: system
        pass_filenames: false

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor
